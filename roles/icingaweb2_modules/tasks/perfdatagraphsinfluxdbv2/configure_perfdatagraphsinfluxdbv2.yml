---

- name: Deploy config.ini
  become: true
  vars:
    _perfdatagraphsinfluxdbv2: "{{ _module_options.config.perfdatagraphsinfluxdbv2 | default(omit) }}"
  ansible.builtin.template:
    src: "{{ role_path }}/templates/perfdatagraphsinfluxdbv2/config.ini.j2"
    dest: "{{ icingaweb2_contrib_modules_config_path }}/modules/perfdatagraphsinfluxdbv2/config.ini"
    owner: "{{ _icingaweb2_contrib_modules_web2_user }}"
    group: "{{ _icingaweb2_contrib_modules_web2_group }}"
    mode: "0660"
