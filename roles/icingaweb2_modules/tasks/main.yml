---

- name: Include OS specific variables
  ansible.builtin.include_vars: "{{ lookup('first_found', params) }}"
  vars:
    params:
      files:
        - "{{ ansible_os_family | lower }}_{{ ansible_distribution | lower }}_{{ ansible_distribution_major_version | lower }}.yml"
        - "{{ ansible_os_family | lower }}_{{ ansible_distribution_major_version | lower }}.yml"
        - "{{ ansible_os_family | lower }}_{{ ansible_distribution | lower }}.yml"
        - "{{ ansible_os_family | lower }}.yml"
        - "default.yml"
      paths:
        - "{{ role_path }}/vars"

- name: Install Icinga Web 2 Module
  when:
    - icingaweb2_contrib_modules is defined
    #- _current_module.name in (_icingaweb2_contrib_modules_known_modules | map(attribute='name'))
  loop: "{{ icingaweb2_contrib_modules }}"
  loop_control:
    loop_var: _current_module
  vars:
    _module_name: "{{ _current_module.name }}"
    _module: "{{ _current_module }}"
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/install_module.yml"

- name: Enable/Disable module
  become: true
  when:
    - icingaweb2_contrib_modules is defined
    - _enabled != omit
  loop: "{{ icingaweb2_contrib_modules }}"
  loop_control:
    loop_var: _current_module
  vars:
    _enabled: "{{ _current_module.enabled | default(omit) }}"
    _symlink_src: "{{ icingaweb2_contrib_modules_path }}/{{ _current_module.name }}"
    _symlink_dest: "{{ icingaweb2_contrib_modules_config_path }}/enabledModules/{{ _current_module.name }}"
  ansible.builtin.file:
    state: "{{ 'link' if _enabled == true else 'absent' }}"
    force: true
    src: "{{ _symlink_src if _enabled else omit }}"
    dest: "{{ _symlink_dest }}"

- name: Make sure configuration directory for module exists
  become: true
  when:
    - icingaweb2_contrib_modules is defined
  loop: "{{ icingaweb2_contrib_modules }}"
  loop_control:
    loop_var: _current_module
  ansible.builtin.file:
    state: directory
    path: "{{ icingaweb2_contrib_modules_config_path }}/modules/{{ _current_module.name }}"
    owner: "{{ _icingaweb2_contrib_modules_web2_user }}"
    group: "{{ _icingaweb2_contrib_modules_web2_group }}"
    mode: "2770"

- name: Configure module
  when:
    - icingaweb2_contrib_modules is defined
    - _module_options != omit
  loop: "{{ icingaweb2_contrib_modules }}"
  loop_control:
    loop_var: _current_module
    index_var: _current_module_index
  vars:
    _module_options: "{{ _current_module.module_options | default(omit) }}"
    _module_files: "{{ _current_module.files | default(omit) }}"
    _paths:
      - "{{ playbook_dir }}/{{ _current_module.name }}"
      - "{{ playbook_dir }}/{{ _current_module.name }}/tasks"
      - "{{ role_path }}/tasks/{{ _current_module.name }}"
    _files:
      - "configure_{{ _current_module.name }}.yml"
    _module_configure_tasks: "{{ lookup('ansible.builtin.first_found', paths=_paths, files=_files, skip=true) | default(role_path + '/tasks/configure_default.yml', true) }}"
  ansible.builtin.include_tasks: "{{ _module_configure_tasks }}"

- name: Deploy module configuration files
  when:
    - icingaweb2_contrib_modules is defined
    - _module_files != omit
  loop: "{{ icingaweb2_contrib_modules }}"
  loop_control:
    loop_var: _current_module
  vars:
    _module_name: "{{ _current_module.name }}"
    _module_files: "{{ _current_module.files | default(omit) }}"
  ansible.builtin.include_tasks: "deploy_config_files.yml"
