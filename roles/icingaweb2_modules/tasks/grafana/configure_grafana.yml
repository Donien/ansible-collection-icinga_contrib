---

- name: Configure dashboards
  when:
    - _module_files.config.grafana is defined
    - _module_options.import_dashboards | default(false)
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/grafana/configure_grafana_dashboards.yml"

- name: Configure graphs.ini
  when:
    - _module_options.local_dashboards is defined
    - _module_options.import_graphs_ini | default(false)
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/grafana/configure_graphs_ini.yml"

- name: Check if folder uid can be fetched
  when:
    - _module_files.config.grafana.host is defined
    - _module_files.config.grafana.apitoken is defined
  vars:
    _protocol: "{{ _module_files.config.grafana.protocol | default('http') }}"
    _host: "{{ _module_files.config.grafana.host | default('localhost:3000') }}"
  ansible.builtin.uri:
    url: "{{ _protocol }}://{{ _host }}/api/folders"
    method: GET
    headers:
      Authorization: "Bearer {{ _module_files.config.grafana.apitoken }}"
      Content-Type: "application/json"
      Accept: "application/json"
  register: _grafana_folder_search

- name: Check if the dashboard uid can be fetched
  when:
    - _module_files.config.grafana.host is defined
    - _module_files.config.grafana.apitoken is defined
  vars:
    _protocol: "{{ _module_files.config.grafana.protocol | default('http') }}"
    _host: "{{ _module_files.config.grafana.host | default('localhost:3000') }}"
    _folderuid: "{{ (_grafana_folder_search.json | selectattr('title', 'match', icingaweb2_contrib_modules_grafana_dashboard_folder_name) | first).uid | default(none) }}" # yamllint disable-line rule:line-length
    _default_dashboard_name: "{{ _module_files.config.grafana.defaultdashboard | default('icinga2-default') }}"
  ansible.builtin.uri:
    url: "{{ _protocol }}://{{ _host }}/api/search?{{ 'folderIds=' + _folderuid if _folderuid else 'query=' + _default_dashboard_name | urlencode }}"
    method: GET
    headers:
      Authorization: "Bearer {{ _module_files.config.grafana.apitoken }}"
      Content-Type: "application/json"
      Accept: "application/json"
  register: _grafana_api_search

- name: Set dashboard uid as fact
  when:
    - _grafana_api_search.json is defined
    - _grafana_api_search.json | length > 0
  ansible.builtin.set_fact:
    _grafana_default_dashboard_uid: "{{ (_grafana_api_search.json | selectattr('title', 'match', 'icinga2-default') | first).uid }}"

- name: Deploy config.ini
  become: true
  vars:
    _grafana: "{{ _module_files.config.grafana | default(omit) }}"
  ansible.builtin.template:
    src: "{{ role_path }}/templates/grafana/config.ini.j2"
    dest: "{{ icingaweb2_contrib_modules_config_path }}/modules/grafana/config.ini"
    owner: "{{ _icingaweb2_contrib_modules_web2_user }}"
    group: "{{ _icingaweb2_contrib_modules_web2_group }}"
    mode: "0660"

- name: Extend list entry for grafana module with found local dashboards
  vars:
    _new_graphs_ini:
      files:
        graphs: "{{ _all_graphs_ini | default({}) | combine(_module_files.graphs | default({})) }}"
  ansible.builtin.set_fact:
    icingaweb2_contrib_modules: "{{
      icingaweb2_contrib_modules[:_current_module_index] +
      [icingaweb2_contrib_modules[_current_module_index] | combine(_new_graphs_ini)] +
      (icingaweb2_contrib_modules[_current_module_index+1:] if icingaweb2_contrib_modules | length > _current_module_index + 1 else [])
    }}"
